<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Village Inn</title>
  </head>
  <body>
    <h2>Village Inn</h2>
    <img src="svg/village inn logo.png" alt="Village inn logo" width="200" />

    <h2>My favorite dish is the strawberry Crepes</h2>
    <img
      src="images/strawberry crepe.jpg"
      alt="Strawberry crepes"
      width="400"
    />

    <h2>video on how to make your own strawberry crepes</h2>
    <iframe
      width="560"
      height="315"
      src="https://www.youtube.com/embed/8lAQLIq3a4A?si=4U8JVYxo3TKJX_4F"
      title="YouTube video player"
      frameborder="0"
      allow="
        accelerometer;
        autoplay;
        clipboard-write;
        encrypted-media;
        gyroscope;
        picture-in-picture;
        web-share;
      "
      referrerpolicy="strict-origin-when-cross-origin"
      allowfullscreen
    ></iframe>

    <footer>
      <p>&copy; Copyright 2026 - Village Inn</p>
    </footer>
  </body>
</html>
